[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-academic"
version = "0.1.0"
description = "METIS ACADEMIC — 面向跨 Agent Harness 的对话级哲学社会科学研究工作流运行时"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
analysis = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7"]
docs = ["python-docx>=1.1", "python-pptx>=0.6.23"]
dev = ["pytest>=7.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
metis = "metis_academic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["online: 需要真实联网的测试，默认跳过"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-academic"
version = "0.2.0"
description = "METIS ACADEMIC — 面向跨 Agent Harness 的对话级哲学社会科学研究工作流运行时"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "pandas>=2.0",
    "numpy>=1.24",
    "tabulate>=0.9",
    # paper-search-pro headless search providers (the deterministic helper
    # source is vendored under metis_academic.paper_search_pro_vendor).
    "pyalex>=0.21",
    "semanticscholar>=0.10",
    "biopython>=1.85",
    "arxiv>=2.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.7", "openpyxl>=3.1", "scipy>=1.10"]
docs = ["python-docx>=1.1", "python-pptx>=0.6.23"]
mcp = ["mcp>=2.2"]
dev = ["pytest>=7.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
metis = "metis_academic.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/MIT-through-1.6.1.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metis_academic = [
    "workflows/**/*.yaml",
    "data/*.yaml",
    "skill_defs/*/SKILL.yaml",
    "skill_defs/*/INSTRUCTIONS.md",
    "skill_defs/*/UPSTREAM.md",
    "skill_defs/*/LICENSE.txt",
    "paper_search_pro_vendor/**/*.yaml",
    "paper_search_pro_vendor/**/*.txt",
    "paper_search_pro_vendor/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["online: 需要真实联网的测试，默认跳过"]

[tool.ruff]
extend-exclude = ["src/metis_academic/paper_search_pro_vendor"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100

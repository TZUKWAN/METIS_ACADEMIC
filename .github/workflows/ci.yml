name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "assets/**", "marketplace/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,analysis,docs,mcp]"
      - name: Dependency consistency
        run: pip check
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Test
        run: pytest -m "not online"
      - name: Hardening status consistency
        run: python scripts/hardening_status.py --check

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:hosts
      - run: npm run test:hosts
      - run: npm pack --ignore-scripts
